<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS sert à styliser la page rapidement -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>TVA Express | SAB X</title>
</head>

<body class="min-h-screen bg-[#020617] text-white flex items-center justify-center px-4 relative overflow-hidden">

    <div class="absolute inset-0 -z-10">
    <div class="absolute left-1/2 top-0 h-96 w-96 -translate-x-1/2 rounded-full bg-cyan-500/20 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 h-96 w-96 rounded-full bg-violet-500/20 blur-3xl"></div>
    <div class="absolute bottom-20 left-0 h-72 w-72 rounded-full bg-blue-500/10 blur-3xl"></div>
  </div>

  <main class="w-full max-w-md rounded-3xl border border-white/10 bg-white/10 p-8 shadow-2xl backdrop-blur">

    <div class="text-center mb-6">
      <p class="text-sm font-semibold text-cyan-400 mb-2">
        SAB X — Mini outil web
      </p>

      <h1 class="text-4xl font-bold mb-3 transition duration-300 hover:scale-105 hover:text-cyan-400 hover:drop-shadow-[0_0_20px_rgba(34,211,238,0.8)] cursor-default">
        TVA Express
      </h1>

      <p class="text-slate-300">
        Calcule rapidement le prix TTC à partir d’un prix HT.
      </p>
    </div>

    <label for="prixHT" class="block text-slate-200 font-medium mb-2">
      Prix HT
    </label>

    <input 
      id="prixHT"
      type="number"
      placeholder="Exemple : 100"
      class="w-full rounded-xl border border-white/10 bg-slate-900/80 p-3 mb-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400"
    >

    <label for="tauxTVA" class="block text-slate-200 font-medium mb-2">
      Taux de TVA
    </label>

    <select 
      id="tauxTVA"
      class="w-full rounded-xl border border-white/10 bg-slate-900/80 p-3 mb-4 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400"
    >
      <option value="20">20 %</option>
      <option value="10">10 %</option>
      <option value="5.5">5,5 %</option>
      <option value="personnalise">Personnalisé</option>
    </select>

    <div id="zoneTauxPersonnalise" class="hidden">
      <label for="tauxPersonnalise" class="block text-slate-200 font-medium mb-2">
        Taux personnalisé
      </label>

      <input 
        id="tauxPersonnalise"
        type="number"
        placeholder="Exemple : 8.5"
        class="w-full rounded-xl border border-white/10 bg-slate-900/80 p-3 mb-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400"
      >
    </div>

    <div class="flex gap-3">
      <button 
        id="boutonCalculer"
        class="w-full rounded-xl bg-cyan-400 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300"
      >
        Calculer
      </button>

      <button 
        id="boutonReset"
        class="w-full rounded-xl bg-white/10 py-3 font-semibold text-white transition hover:bg-white/20"
      >
        Réinitialiser
      </button>
    </div>

     <div class="mt-6 rounded-2xl border border-cyan-400/20 bg-cyan-400/10 p-4 text-center">
      <p id="creditsRestants" class="text-sm font-semibold text-cyan-300">
    Crédits restants : 50
      </p>
    </div>

    <button 
  id="boutonRecharger"
  class="mt-4 w-full rounded-xl bg-violet-500 py-3 font-semibold text-white transition hover:bg-violet-400"
    >
  Recharger 50 crédits avec Stripe
    </button>

<div 
  id="resultat"
  class="mt-4 rounded-2xl border border-white/10 bg-slate-900/70 p-4 text-center text-slate-200"
>
  Résultat : en attente...
</div>

    <div class="mt-6 border-t border-white/10 pt-5 text-center">
      <p class="mb-3 text-sm text-slate-400">
        Ce mini-outil vous aide ? Vous pouvez soutenir SAB X.
      </p>

      <a 
        href="https://www.paypal.com/paypalme/tonlien"
        target="_blank"
        class="inline-block rounded-xl bg-white px-5 py-3 font-semibold text-slate-950 transition hover:bg-slate-200"
      >
        Soutenir via PayPal
      </a>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
